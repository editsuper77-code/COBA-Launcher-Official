name: Build APK

on:
  push:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Accept Android licenses
      run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true

    - uses: gradle/actions/setup-gradle@v4

    - name: Restore missing folders from original repo
      run: |
        APP=$(find . -path '*/app_mojo/build.gradle' | head -n 1)
        ROOT=$(dirname "$(dirname "$APP")")
        git clone https://github.com/MojoLauncher/MojoLauncher /tmp/orig
        git -C /tmp/orig submodule update --init --recursive
        for d in glfw sdl mojoexec NoBlocklist app_mojo/src/main/jni/glfw app_mojo/src/main/jni/sdl; do
          if [ -e "/tmp/orig/$d" ] && [ -z "$(ls -A "$ROOT/$d" 2>/dev/null)" ]; then
            echo "Restoring $d"
            rm -rf "$ROOT/$d"
            cp -a "/tmp/orig/$d" "$ROOT/$d"
            rm -rf "$ROOT/$d/.git"
          else
            echo "Skipping $d"
          fi
        done

    - name: Show SDL mouse API and patch SDLBackend
      run: |
        APP=$(find . -path '*/app_mojo/build.gradle' | head -n 1)
        ROOT=$(dirname "$(dirname "$APP")")
        echo "=== SDL mouse methods ==="
        grep -rn "onNativeMouse" "$ROOT/sdl" --include=SDLActivity.java || echo "not found"
        python3 - "$ROOT" <<'EOF'
        import sys, glob
        root = sys.argv[1]
        files = glob.glob(root + "/app_mojo/src/main/java/**/SDLBackend.java", recursive=True)
        for f in files:
            s = open(f).read()
            a = "SDLActivity.onNativeMouseButton(button, state, 0, 0, true);"
            b = "SDLActivity.onNativeMouseButton(button, state, (float) x, (float) y, false);"
            s = s.replace(a, "SDLActivity.onNativeMouseButton(button, state);")
            s = s.replace(b, "{ SDLActivity.onNativeMouse(0, MotionEvent.ACTION_MOVE, (float) x, (float) y, false); SDLActivity.onNativeMouseButton(button, state); }")
            open(f, "w").write(s)
            print("patched", f)
        EOF

    - name: Build
      run: |
        APP=$(find . -path '*/app_mojo/build.gradle' | head -n 1)
        ROOT=$(dirname "$(dirname "$APP")")
        cd "$ROOT"
        chmod +x gradlew
        ./gradlew :app_mojo:assembleFullDebug --console=plain 2>&1 | tee build.log || true
        echo "=========== ERROR SUMMARY ==========="
        grep -A 12 "What went wrong" build.log || echo "No error block found"
        grep -E "error:" build.log | head -n 15 || true
        grep -q "BUILD SUCCESSFUL" build.log

    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: apks
        path: '**/build/outputs/apk/**/*.apk'
