name: Build APK

on:
  push:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive

    - uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Accept Android licenses
      run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true

    - uses: gradle/actions/setup-gradle@v4

    - name: Fetch missing submodules
      run: |
        G=$(find . -name gradlew | head -n 1)
        cd "$(dirname "$G")"
        echo "=== .gitmodules ==="
        cat .gitmodules || true
        git config -f .gitmodules --get-regexp '^submodule\..*\.path$' | while read key path; do
          name=${key#submodule.}; name=${name%.path}
          url=$(git config -f .gitmodules --get "submodule.$name.url")
          if [ -z "$(ls -A "$path" 2>/dev/null)" ]; then
            echo "Cloning $url -> $path"
            rm -rf "$path"
            git clone --depth 1 --recurse-submodules "$url" "$path" || echo "CLONE FAILED: $url"
          fi
        done
        echo "=== top folders ==="
        ls
        echo "=== glfw / sdl / NoBlocklist ==="
        ls glfw sdl NoBlocklist || true

    - name: Skip NoBlocklist if still missing
      run: |
        G=$(find . -name gradlew | head -n 1)
        cd "$(dirname "$G")"
        if ! ls NoBlocklist/build.gradle* >/dev/null 2>&1; then
          echo "NoBlocklist missing, removing its line from app_mojo/build.gradle"
          sed -i '/project(":NoBlocklist")/d' app_mojo/build.gradle
        fi

    - name: Build
      run: |
        G=$(find . -name gradlew | head -n 1)
        cd "$(dirname "$G")"
        chmod +x gradlew
        ./gradlew :app_mojo:assembleFullDebug --stacktrace

    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: apks
        path: '**/build/outputs/apk/**/*.apk'
