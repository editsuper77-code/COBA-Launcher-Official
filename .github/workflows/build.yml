name: Build APK

on:
  push:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Accept Android licenses
      run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true

    - uses: gradle/actions/setup-gradle@v4

    - name: Restore missing folders from original repo
      run: |
        APP=$(find . -path '*/app_mojo/build.gradle' | head -n 1)
        ROOT=$(dirname "$(dirname "$APP")")
        git clone https://github.com/MojoLauncher/MojoLauncher /tmp/orig
        git -C /tmp/orig submodule update --init --recursive
        for d in glfw sdl mojoexec NoBlocklist app_mojo/src/main/jni/glfw app_mojo/src/main/jni/sdl; do
          if [ -e "/tmp/orig/$d" ] && [ -z "$(ls -A "$ROOT/$d" 2>/dev/null)" ]; then
            echo "Restoring $d"
            rm -rf "$ROOT/$d"
            cp -a "/tmp/orig/$d" "$ROOT/$d"
            rm -rf "$ROOT/$d/.git"
          else
            echo "Skipping $d"
          fi
        done

    - name: Find SDL version matching your code
      run: |
        APP=$(find . -path '*/app_mojo/build.gradle' | head -n 1)
        ROOT=$(dirname "$(dirname "$APP")")
        git clone https://github.com/MojoLauncher/MojoSDL /tmp/sdlrepo
        cd /tmp/sdlrepo
        FOUND=""
        for c in $(git rev-list --all -- '*SDLActivity.java'); do
          f=$(git ls-tree -r --name-only "$c" | grep 'SDLActivity.java$' | head -n 1)
          [ -z "$f" ] && continue
          if git show "$c:$f" | grep -qE 'onNativeMouseButton\([^,)]*,[^,)]*,[^,)]*,[^,)]*,[^,)]*\)'; then
            FOUND="$c"; break
          fi
        done
        echo "Matching SDL commit: ${FOUND:-NONE}"
        if [ -n "$FOUND" ]; then
          git checkout -f "$FOUND"
          git submodule update --init --recursive || true
          rm -rf "$ROOT/sdl"
          cp -a /tmp/sdlrepo "$ROOT/sdl"
          rm -rf "$ROOT/sdl/.git"
        fi

    - name: Build
      run: |
        APP=$(find . -path '*/app_mojo/build.gradle' | head -n 1)
        ROOT=$(dirname "$(dirname "$APP")")
        cd "$ROOT"
        chmod +x gradlew
        ./gradlew :app_mojo:assembleFullDebug --console=plain 2>&1 | tee build.log || true
        echo "=========== ERROR SUMMARY ==========="
        grep -A 12 "What went wrong" build.log || echo "No error block found"
        grep -E "error:" build.log | head -n 15 || true
        grep -q "BUILD SUCCESSFUL" build.log

    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: apks
        path: '**/build/outputs/apk/**/*.apk'
