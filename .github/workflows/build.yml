name: Build APK

on:
  push:
    branches: [ master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Grant execute permission for gradlew
      run: |
        cd Coba-lachucher--3_openjdk
        chmod +x gradlew

    - name: Build with Gradle
      run: |
        cd Coba-lachucher--3_openjdk
        ./gradlew :app_mojo:assembleDebug --no-daemon

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: Coba-lachucher--3_openjdk/                 
        app_mojo/build/outputs/apk/debug/
app-debug.apk
